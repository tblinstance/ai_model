{% verbatim %}
<div class="flex items-center justify-between gap-2 px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-200 dark:border-slate-800">
  <span class="text-xs font-semibold text-indigo-700 dark:text-indigo-300 flex items-center gap-1.5">
    <i data-lucide="shield-check" class="w-3.5 h-3.5 text-cyan-600 dark:text-cyan-400"></i>
    Admin Portal Login
  </span>
  <span class="text-[10px] font-mono uppercase px-2 py-0.5 rounded-md bg-cyan-500/15 text-cyan-700 dark:text-cyan-300">
    Staff Only
  </span>
</div>

<div v-if="store.authMode === 'register'" class="rounded-xl bg-amber-50 dark:bg-amber-500/15 border border-amber-200 dark:border-amber-500/40 px-3.5 py-2.5 text-xs text-amber-800 dark:text-amber-200 space-y-2">
  <div>
    Member sign-up happens on the Member Frontend (<span class="font-mono">http://127.0.0.1:5173</span>). This backend portal is restricted to Admin accounts.
  </div>
  <button
    type="button"
    @click="switchAuthMode('login')"
    class="px-2.5 py-1 rounded-lg bg-amber-600 text-white text-[11px] font-semibold hover:bg-amber-500"
  >
    Switch to Admin Login
  </button>
</div>

<div v-if="store.authError" class="rounded-xl bg-rose-50 dark:bg-rose-500/15 border border-rose-200 dark:border-rose-500/40 px-3.5 py-2.5 text-xs text-rose-700 dark:text-rose-200 break-words">
  {{ store.authError }}
</div>

<form @submit.prevent="submitAuth" class="space-y-3">
  <div class="space-y-1">
    <label class="text-[11px] font-medium text-slate-600 dark:text-slate-400">Admin Username</label>
    <input
      v-model="authForm.username"
      type="text"
      placeholder="Enter admin username"
      autocomplete="username"
      required
      class="w-full rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 px-3.5 py-2 text-sm text-slate-900 dark:text-white focus:border-cyan-500 focus:outline-none"
    />
  </div>

  <div class="space-y-1">
    <label class="text-[11px] font-medium text-slate-600 dark:text-slate-400">Password</label>
    <div class="relative">
      <input
        v-model="authForm.password"
        :type="store.showPassword ? 'text' : 'password'"
        placeholder="Enter password"
        autocomplete="current-password"
        required
        class="w-full rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 pl-3.5 pr-10 py-2 text-sm text-slate-900 dark:text-white focus:border-cyan-500 focus:outline-none"
      />
      <button
        type="button"
        @click="store.showPassword = !store.showPassword"
        class="absolute right-2.5 top-1/2 -translate-y-1/2 p-1 text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white"
        aria-label="Toggle password visibility"
      >
        <i :data-lucide="store.showPassword ? 'eye-off' : 'eye'" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <div class="flex flex-col gap-2 pt-1">
    <button
      type="submit"
      :disabled="store.authBusy"
      class="w-full py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-indigo-600 hover:opacity-95 text-white text-sm font-semibold disabled:opacity-50"
    >
      {{ store.authBusy ? 'Authenticating...' : 'Admin Sign In' }}
    </button>
  </div>

  <div class="pt-1 text-center text-[11px] text-slate-500 dark:text-slate-400">
    Member account? Sign in or pay BDT at
    <a href="http://127.0.0.1:5173" class="text-cyan-600 dark:text-cyan-400 hover:underline font-mono">http://127.0.0.1:5173</a>
  </div>
</form>
{% endverbatim %}
