<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tblinc AI</title>
  <link rel="icon" type="image/svg+xml" href="/tblinc-ai-icon.svg" />
  <link rel="shortcut icon" href="/favicon.svg" />
  <script>
    (function () {
      var saved = localStorage.getItem("theme");
      var isDark = saved ? saved === "dark" : true;
      document.documentElement.classList.toggle("dark", isDark);
      document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet" />
</head>

<body
  class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased transition-colors duration-200">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
