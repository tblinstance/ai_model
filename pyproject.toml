[project]
name = "ai-model"
version = "0.1.0"
description = ""
authors = [
    {name = "tblinstance",email = "tblinstance@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django (>=6.1.3,<7.0.0)",
    "torch (>=2.14.0,<3.0.0)",
    "tensorflow (>=2.22.0rc0,<3.0.0)",
    "keras (>=3.15.1,<4.0.0)",
    "djoser (>=2.3.5,<3.0.0)",
    "fastapi (>=0.162.3,<0.163.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "pydantic (>=2.14.3,<3.0.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "numpy (>=2.0.0,<3.0.0)",
    "pillow (>=13.0.0,<14.0.0)",
    "whitenoise (>=6.12.0,<7.0.0)",
    "python-multipart (>=0.0.33,<0.0.34)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "psycopg[binary] (>=3.3.0,<4.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "imageio-ffmpeg (>=0.8.1,<0.9.0)",
    "transformers (>=4.48.0)",
    "accelerate (>=1.3.0)",
    "diffusers (>=0.32.0)",
    "opencv-python (>=4.10.0)",
    "edge-tts (>=7.0.0)",
    "openai-whisper (>=20240930)",
    "librosa (>=0.10.0)",
    "soundfile (>=0.12.0)",
    "insightface (>=0.7.3)",
    "onnxruntime (>=1.18.0)",
    "torchvision (>=0.19.0)",
    "torchaudio (>=2.4.0)",
    "safetensors (>=0.4.0)",
    "vllm (>=0.6.0)",
    "bitsandbytes (>=0.43.0)",
    "sentence-transformers (>=3.0.0)",
    "chromadb (>=0.5.0)",
    "peft (>=0.12.0)",
    "datasets (>=3.0.0)",
    "google-genai (>=0.1.0)",
    "beautifulsoup4 (>=4.12.0)",
    "scikit-image (>=0.24.0)",
    "einops (>=0.8.0)",
    "scipy (>=1.18.0)",
    "imageio (>=2.38.0)",
    "torchcodec (>=0.17.0)"
]

[tool.poetry]
packages = [{include = "ai_model", from = "src"}]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
